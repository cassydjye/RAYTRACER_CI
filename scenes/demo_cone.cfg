# Demo scene — one red sphere on a sky background.
# Run: ./raytracer scenes/demo_sphere.cfg > output.ppm

camera:
{
    resolution = { width = 1920; height = 1080; };
    position   = { x = 7; y = 1; z = 5; };
    rotation   = { x = 0; y = 50; z = 0; };
    //position   = { x = -1; y = -0.25; z = -0.25 }; // good position/rotation for triangles 
    //rotation   = { x = 0; y = -50; z = 0; };
    samples    = 16; 
    fieldOfView = 60.0;
};

primitives:
{
    cones = (
    { x = 0; y = 0; z = -2; ax = 0; ay = 1; az = 0; r = 0.5; h = 1.5;
      color = { r = 255; g = 120; b = 40; }; specular = 0.4; shininess = 16; }
    );
    planes = (
        { x = 0; y = -0.5; z = 0; nx = 0; ny = 1; nz = 0; color = { r = 135; g = 206; b = 235; };}
    );
};

lights:
{
    ambient = 0.45;
    diffuse = 0.85;
    directional = (
        { x = 1; y = 1.0; z = 2.0; }
    );
};
