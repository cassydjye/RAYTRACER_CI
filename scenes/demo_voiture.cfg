# Demo scene — one red sphere on a sky background.
# Run: ./raytracer scenes/demo_sphere.cfg > output.ppm

camera:
{
    resolution = { width = 1920; height = 1080; };
    position   = { x = 5; y = 1; z = 3; };
    rotation   = { x = 0; y = 50; z = 0; };
    //position   = { x = -1; y = -0.25; z = -0.25 }; // good position/rotation for triangles 
    //rotation   = { x = 0; y = -50; z = 0; };
    samples    = 16; 
    fieldOfView = 60.0;
};

primitives:
{
    meshes = (
    {
        file     = "voiture.obj";
        position = { x = 0.0; y = -0.5; z = -2.0; };
        translation = { x = 2; y = 0; z = 0; };
        rotation = { x = 0; y = 0; z = 0; };
        color    = { r = 154; g = 175; b = 255; };
        specular = 0.9; shininess = 4;
        reflectivity = 0.3;
    }
    );
    spheres = (
        { x = -2.0; y = 1.0; z = -1.0; r = 0.5;
        color = { r = 255; g = 50; b = 50; }; reflectivity = 1; }
    );
    planes = (
        { x = 0; y = -0.5; z = 0; nx = 0; ny = 1; nz = 0; color = { r = 255; g = 125; b = 125; };}
    );
};

lights:
{
    ambient = 0.45;
    diffuse = 0.85;
    directional = (
        { x = 1; y = 3.0; z = 2.0; }
    );
};
