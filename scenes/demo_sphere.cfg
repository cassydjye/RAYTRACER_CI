# Demo scene — one red sphere on a sky background.
# Run: ./raytracer scenes/demo_sphere.cfg > output.ppm

camera:
{
    resolution = { width = 1920; height = 1080; };
    position   = { x = 0; y = -0.15; z = 2; };
    rotation   = { x = 0; y = 0; z = 0; };
    fieldOfView = 60.0;
};

primitives:
{
    spheres = (
        { x = 0.10;    y = -0.35;  z = -1.6; r = 0.15;  color = { r = 255; g = 165; b = 0; }; specular = 0.8; shininess = 4;},
        { x = -0.10; y = -0.35; z = -1.6; r = 0.15; color = { r = 255; g = 165; b = 0; }; specular = 0.8; shininess = 4;},
        { x = -0.60;    y = -0.35;  z = -1.6; r = 0.15;  color = { r = 255; g = 165; b = 0; }; specular = 0.8; shininess = 4;},
        { x = -0.40; y = -0.35; z = -1.6; r = 0.15; color = { r = 255; g = 165; b = 0; }; specular = 0.8; shininess = 4;}, 
        { x = 0.40;    y = -0.35;  z = -1.6; r = 0.15;  color = { r = 255; g = 165; b = 0; }; specular = 0.8; shininess = 4;}, 
        { x = 0.60; y = -0.35; z = -1.6; r = 0.15; color = { r = 255; g = 165; b = 0; }; specular = 0.8; shininess = 4;}
    );
    planes = (
        //{ x = 0; y = -0.5; z = 0; nx = 0; ny = 1; nz = 0; color = { r = 64; g = 64; b = 255; }; },
        { x = 0; y = -0.5; z = 0; nx = 0; ny = 1; nz = 0; color = { r = 135; g = 206; b = 235; };}// specular = 0.8; shininess = 64; }
    );
};

lights:
{
    ambient = 0.45;
    diffuse = 0.85;
    directional = (
        { x = 0.5; y = 1.0; z = -2.0; }
    );
};
