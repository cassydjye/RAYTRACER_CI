# Demo scene — one red sphere on a sky background.
# Run: ./raytracer scenes/demo_sphere.cfg > output.ppm

camera:
{
    resolution = { width = 1920; height = 1080; };
    position   = { x = 0; y = 0; z = 0; };
    rotation   = { x = 0; y = 0; z = 0; };
    fieldOfView = 60.0;
};

primitives:
{
    spheres = (
        { x = 0;    y = 0;    z = -1;   r = 0.3;  color = { r = 204; g = 51;  b = 51;  }; },
        { x = -0.6; y = 0;    z = -1.2; r = 0.25; color = { r = 51;  g = 153; b = 255; }; },
        { x = 0.6;  y = -0.1; z = -0.9; r = 0.2;  color = { r = 51;  g = 204; b = 102; }; }
    );
};

lights:
{
    ambient = 0.50;
    diffuse = 0.85;
    directional = (
        { x = 1.0; y = 1.0; z = 0.5; }
    );
};
