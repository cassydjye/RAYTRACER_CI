# Demo scene — one red sphere on a sky background.
# Run: ./raytracer scenes/demo_sphere.cfg > output.ppm

camera:
{
    resolution = { width = 1920; height = 1080; };
    position   = { x = 0; y = 0; z = 0; };
    rotation   = { x = 0; y = 0; z = 0; };
    fieldOfView = 60.0;
};

primitives:
{
    spheres = (
        { x = 0;    y = 0;    z = -1;   r = 0.3;  color = { r = 204; g = 51;  b = 51;  }; },
        { x = -0.6; y = 0;    z = -1.2; r = 0.25; color = { r = 51;  g = 153; b = 255; }; },
        # { x = 0.6;  y = -0.1;   z = -0.9; r = 0.2;  color = { r = 51;  g = 204; b = 102; }; },
        # { x = 0;    y = 0.5;  z = -1.5; r = 0.4;  color = { r = 255; g = 255; b = 102; }; },
        { x = -0.5; y = -0.5; z = -1.8; r = 0.15; color = { r = 255; g = 102; b = 255; }; }
    );
    planes = (
        { x = 0; y = -0.5; z = 0; nx = 0; ny = 1; nz = 0; color = { r = 64; g = 64; b = 255; }; },
        { x = 0; y = 0; z = -2; nx = 0; ny = 0; nz = 1; color = { r = 135; g = 206; b = 235; }; }
    );
    cylinders = (
        { x = 0.5; y = 0; z = -1; ax = 0; ay = 1; az = 0; r = 0.1; h = 0.5; color = { r = 255; g = 165; b = 0; }; }
    );
    triangles = (
        { v0 = { x = -0.5; y = 0; z = -1; }; v1 = { x = 0; y = 0.5; z = -1; }; v2 = { x = 0.5; y = 0; z = -1; }; color = { r = 255; g = 255; b = 0; }; },
        { v0 = { x = -0.5; y = -0.5; z = -1; }; v1 = { x = 0; y = 0; z = -1; }; v2 = { x = 0.5; y = -0.5; z = -1; }; color = { r = 255; g = 0; b = 255; }; }
    );
};

lights:
{
    ambient = 0.50;
    diffuse = 0.85;
    directional = (
        { x = 1.0; y = 1.0; z = 0.5; }
    );
};
